<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="card-header">
        <div class="eyebrow">We value your opinion</div>
        <h1>Share your feedback</h1>
        <p class="subtitle">Tell us about your experience. Your response is saved securely in our database.</p>
      </div>

      <form id="feedbackForm">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" maxlength="80" placeholder="Enter your name" required>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" maxlength="120" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="rating">Overall rating</label>
          <div class="rating-group" id="rating">
            <input type="radio" name="rating" value="5" id="star5"><label for="star5" aria-label="5 stars">5</label>
            <input type="radio" name="rating" value="4" id="star4"><label for="star4" aria-label="4 stars">4</label>
            <input type="radio" name="rating" value="3" id="star3"><label for="star3" aria-label="3 stars">3</label>
            <input type="radio" name="rating" value="2" id="star2"><label for="star2" aria-label="2 stars">2</label>
            <input type="radio" name="rating" value="1" id="star1"><label for="star1" aria-label="1 star">1</label>
          </div>
          <p class="field-hint">How would you rate your experience?</p>
        </div>

        <div class="field">
          <label for="message">Your feedback</label>
          <textarea id="message" name="message" rows="5" maxlength="1000" placeholder="Write your comments here..." required></textarea>
        </div>

        <button id="submitButton" type="submit">Submit feedback</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <footer>Simple Feedback App · FastAPI + SQLite</footer>
  </main>
  <script>
    const form = document.getElementById("feedbackForm");
    const statusText = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      statusText.textContent = "";
      statusText.className = "";
      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      const ratingInputs = form.elements["rating"];
      let ratingValue = null;
      for (let i = 0; i < ratingInputs.length; i++) {
        if (ratingInputs[i].checked) {
          ratingValue = parseInt(ratingInputs[i].value, 10);
          break;
        }
      }

      const data = {
        name: form.elements["name"].value.trim(),
        email: form.elements["email"].value.trim(),
        rating: ratingValue,
        message: form.elements["message"].value.trim()
      };

      try {
        const response = await fetch("/api/feedback", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const responseText = await response.text();

        let result;
        try {
          result = JSON.parse(responseText);
        } catch {
          result = { message: responseText || "Feedback submitted successfully." };
        }

        if (response.ok) {
          statusText.textContent = result.message || "Thank you! Your feedback has been saved.";
          statusText.className = "success";
          form.reset();
        } else {
          statusText.textContent = result.message || "Something went wrong. Please try again.";
          statusText.className = "error";
        }
      } catch (err) {
        statusText.textContent = "Unable to submit feedback. Please try again later.";
        statusText.className = "error";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit feedback";
      }
    });
  </script>
</body>
</html>
