<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="card-header">
        <div class="eyebrow">WE VALUE YOUR OPINION</div>
        <button id="themeToggleBtn" type="button" class="theme-toggle-btn" aria-label="Toggle theme">
          🌙 Dark Mode
        </button>
      </div>

      <h1>Share your feedback</h1>
      <p class="subtitle">Tell us about your experience. Your response is saved securely in our database.</p>

      <form id="feedbackForm">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" maxlength="80" placeholder="Enter your name" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" maxlength="120" placeholder="you@example.com" required>

        <label for="rating">How would you rate your experience?</label>
        <select id="rating" name="rating" required>
          <option value="">Choose a rating</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Very good</option>
          <option value="3">3 - Good</option>
          <option value="2">2 - Fair</option>
          <option value="1">1 - Poor</option>
        </select>

        <label for="message">Your feedback</label>
        <textarea id="message" name="message" rows="5" maxlength="1000"
          placeholder="Write your comments here..." required></textarea>

        <button id="submitButton" type="submit">Submit feedback</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <footer>Simple Feedback App · FastAPI + SQLite</footer>
  </main>

  <script>
    // Theme toggle handling with localStorage persistence
    const themeBtn = document.getElementById("themeToggleBtn");
    const currentTheme = localStorage.getItem("app_theme") || "light";
    if (currentTheme === "dark") {
      document.body.classList.add("dark-mode");
      if (themeBtn) themeBtn.textContent = "☀️ Light Mode";
    }

    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        themeBtn.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
        localStorage.setItem("app_theme", isDark ? "dark" : "light");
      });
    }

    // Feedback submission handling
    const form = document.getElementById("feedbackForm");
    const statusText = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    if (form) {
      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        statusText.textContent = "";
        submitButton.disabled = true;
        submitButton.textContent = "Submitting...";

        const data = {
          name: form.elements["name"].value.trim(),
          email: form.elements["email"].value.trim(),
          rating: Number(form.elements["rating"].value),
          message: form.elements["message"].value.trim()
        };

        try {
          const response = await fetch("/api/feedback", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
          });

          const responseText = await response.text();
          let result;

          try {
            result = JSON.parse(responseText);
          } catch {
            throw new Error("Server returned an invalid response. Check your backend.");
          }

          if (!response.ok) {
            throw new Error(result.detail || "Failed to save feedback.");
          }

          statusText.textContent = "Feedback submitted successfully!";
          statusText.className = "success";
          form.reset();

        } catch (error) {
          statusText.textContent = error.message;
          statusText.className = "error";
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Submit feedback";
        }
      });
    }
  </script>
</body>
</html>
