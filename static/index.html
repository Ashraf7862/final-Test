<!-- Add dark mode toggle button and script into the active HTML file -->
<div class="toggle-button" id="toggle-dark-mode">
  <span class="icon"></span>
  <span class="text">Dark Mode</span>
</div>
<script>
  document.getElementById('toggle-dark-mode').addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
  });
</script>

<!-- Add theme CSS into the active CSS file -->
<style>
  .dark-mode {
    background-color: #333;
    color: #fff;
  }
  .dark-mode .card {
    background-color: #444;
  }
  .dark-mode .card-header {
    background-color: #555;
  }
  .dark-mode .card-header .eyebrow {
    color: #ccc;
  }
  .dark-mode .card-header h1 {
    color: #fff;
  }
  .dark-mode .card-header .subtitle {
    color: #ccc;
  }
  .dark-mode .form {
    background-color: #444;
  }
  .dark-mode .form .field {
    background-color: #555;
  }
  .dark-mode .form .label {
    color: #ccc;
  }
  .dark-mode .form input,
  .dark-mode .form textarea {
    background-color: #666;
  }
</style>
