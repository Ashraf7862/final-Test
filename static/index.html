<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="eyebrow">WE VALUE YOUR OPINION</div>
        <button type="button" id="themeToggleBtn" style="width: auto; margin: 0; padding: 6px 14px; font-size: 13px; background: #4169d8; border-radius: 20px;">🌙 Dark Mode</button>
      </div>
      <h1>Share your feedback</h1>
      <p class="subtitle">Tell us about your experience. Your response is saved securely in our database.</p>

      <form id="feedbackForm">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" maxlength="80" placeholder="Enter your name" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" maxlength="120" placeholder="you@example.com" required>

        <label for="rating">How would you rate your experience?</label>
        <select id="rating" name="rating" required>
          <option value="">Choose a rating</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Very good</option>
          <option value="3">3 - Good</option>
          <option value="2">2 - Fair</option>
          <option value="1">1 - Poor</option>
        </select>

        <label for="message">Your feedback</label>
        <textarea id="message" name="message" rows="5" maxlength="1000"
          placeholder="Write your comments here..." required></textarea>

        <button id="submitButton" type="submit">Submit feedback</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <footer>Simple Feedback App · FastAPI + SQLite</footer>
  </main>
  <script>
    const form = document.getElementById("feedbackForm");
    const statusText = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async (event) => {
    event.preventDefault();

    statusText.textContent = "";
    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";

    const data = {
        name: form.elements["name"].value.trim(),
        email: form.elements["email"].value.trim(),
        rating: Number(form.elements["rating"].value),
        message: form.elements["message"].value.trim()
    };

    try {
        const response = await fetch("/api/feedback", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const responseText = await response.text();

        let result;

        try {
            result = JSON.parse(responseText);
        } catch {
            throw new Error(
                "Server returned an invalid response. Check your backend."
            );
        }

        if (!response.ok) {
            throw new Error(
                result.detail || "Failed to save feedback."
            );
        }

        statusText.textContent = "Feedback submitted successfully!";
        statusText.className = "success";

        form.reset();

    } catch (error) {
        statusText.textContent = error.message;
        statusText.className = "error";

    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit feedback";
    }
});

    // Dark mode toggle functionality
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    function applyTheme(isDark) {
      if (isDark) {
        document.body.classList.add("dark-mode");
        if (themeToggleBtn) themeToggleBtn.textContent = "☀️ Light Mode";
      } else {
        document.body.classList.remove("dark-mode");
        if (themeToggleBtn) themeToggleBtn.textContent = "🌙 Dark Mode";
      }
    }
    const savedTheme = localStorage.getItem("feedback_app_theme");
    applyTheme(savedTheme === "dark");

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        const isDark = !document.body.classList.contains("dark-mode");
        localStorage.setItem("feedback_app_theme", isDark ? "dark" : "light");
        applyTheme(isDark);
      });
    }
  </script>
</body>
</html>
